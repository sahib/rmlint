name: Linux

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: &skip_static
      - '**.md'
      - '.gitignore'
  push:
    branches:
      - master
      - develop
    paths-ignore: *skip_static
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      RM_TS_DIR: "/tmp/rmlint-tests"
      RM_TS_ALWAYS_CLEAN: 1
    steps:
      - uses: actions/checkout@v7

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            scons gettext python3-setuptools libblkid-dev \
            libelf-dev libglib2.0-dev libjson-glib-dev \
            python3-pip python3-cffi python3-dev libffi-dev
          pip3 install -r docs/requirements.txt

      - name: Build
        run: |
          scons --show-config --without-gui VERBOSE=1 DEBUG=1 O=release

      - name: Build documentation
        run: |
          scons STRICT=1 docs

      - name: Prepare test environment
        # The test suite is seriously disk-intensive. Given that linux
        #  instances hosted in GitHub have 16G of RAM available we will
        #  use it to speed up the run.
        run: |
          pip3 install -r tests/requirements.txt
          sudo mkdir "${RM_TS_DIR}"
          sudo mount -o size=12G,nr_inodes=0 -t tmpfs tmpfs "${RM_TS_DIR}"

      - name: Test
        run: |
          pytest -v -m ''

      - name: GUI tests
        shell: bash
        run: |
          sudo apt-get install -y --no-install-recommends xvfb \
            python3-gi-cairo gir1.2-gtksource-4 gir1.2-polkit-1.0 librsvg2-common \
            python3-colorlog python3-parsedatetime
          xvfb-run -a pytest tests/test_gui

      - name: CoW tests
        shell: bash
        run: |
          sudo umount "${RM_TS_DIR}"
          sudo modprobe brd rd_nr=1 rd_size=12582912
          sudo mkfs.btrfs -f /dev/ram0
          sudo mount /dev/ram0 "${RM_TS_DIR}"
          sudo chmod 0777 "${RM_TS_DIR}"
          pytest -m reflink

      - name: Cleanup
        run: |
          sudo umount "${RM_TS_DIR}"
          sudo rmdir "${RM_TS_DIR}"

      - name: installer test
        run: |
          sudo apt-get install -y --no-install-recommends \
            python3-setuptools python3-build python3-installer
          sudo scons install
          sudo scons uninstall
