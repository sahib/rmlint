name: Multi-distro

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: &skip
      - "docs/**"
      - "gui/**"
      - "tests/**"
      - '**.md'
      - '**.rst'
      - '.gitignore'
  push:
    branches:
      - master
      - develop
    paths-ignore: *skip
  workflow_dispatch:

jobs:
  multi-distro-build:
    name: Build (${{ matrix.build.tag }})
    runs-on: ubuntu-latest
    # XXX: Tumbleweed mirror syncs can temporarily leave metadata inconsistent,
    # see https://forums.opensuse.org/t/repo-oss-repository-gpg-key-failure/189888
    continue-on-error:  ${{ matrix.build.tag == 'opensuse/tumbleweed:latest' }}
    strategy:
      fail-fast: false
      matrix:
        build:
          # Enterprise Linux
          - tag: "almalinux:10"
            installcmd: &el_dnf "dnf install -y epel-release && dnf install -y"
            pkgs: &el_pkg "gcc python3-scons glib2-devel json-glib-devel"
          - tag: "quay.io/centos/centos:stream10"
            installcmd: *el_dnf
            pkgs: *el_pkg
          # ArchLinux
          - tag: "archlinux:latest"
            installcmd: "pacman -Syu --noconfirm"
            pkgs: "base-devel json-glib scons"
          # Debian
          - tag: "debian:stable"
            env: &deb_env "DEBIAN_FRONTEND=noninteractive"
            installcmd: &deb_apt "apt-get update && apt-get install -y --no-install-recommends"
            pkgs: &deb_pkg "gcc scons pkg-config gettext libblkid-dev libelf-dev libffi-dev libglib2.0-dev libjson-glib-dev python3-sphinx"
          - tag: "debian:testing"
            env: *deb_env
            installcmd: *deb_apt
            pkgs: *deb_pkg
          # Fedora
          - tag: "fedora:latest"
            installcmd: &fedora_dnf "dnf install -y"
            pkgs: &fedora_pkg "gcc python3-scons pkgconf-pkg-config glib2-devel json-glib-devel"
          - tag: "fedora:rawhide"
            installcmd: *fedora_dnf
            pkgs: *fedora_pkg
          # OpenSUSE
          - tag: "opensuse/leap:latest"
            installcmd: &suse_zyp "zypper -n install"
            pkgs: &suse_pkg "gcc scons pkgconf glib2-devel json-glib-devel libelf-devel libblkid-devel"
          - tag: "opensuse/tumbleweed:latest"
            installcmd: *suse_zyp
            pkgs: *suse_pkg
          # Ubuntu
          - tag: "ubuntu:resolute"
            env: *deb_env
            installcmd: *deb_apt
            pkgs: *deb_pkg
          - tag: "ubuntu:rolling"
            env: *deb_env
            installcmd: *deb_apt
            pkgs: *deb_pkg
    steps:
      - uses: actions/checkout@v7

      - name: "Build on ${{ matrix.build.tag }}"
        run: >
          echo "
            export UNUSED_VAR_SO_THIS_CMD_IS_NEVER_EMPTY= ${{ matrix.build.env }} 
            ${{ matrix.build.installcmd }} ${{ matrix.build.pkgs }}
            cd /build
            scons --show-config --without-gui VERBOSE=1 DEBUG=1 O=release
            exit
          " | docker run --rm -i -v "$PWD:/build" "${{ matrix.build.tag }}" sh
